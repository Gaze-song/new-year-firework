<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>江江公主新年快乐</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 120%, #1a1033 0%, #0a0618 45%, #03020a 100%);
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  #canvas {
    position: absolute;
    inset: 0;
    display: block;
  }
  /* 星空层 */
  .stars {
    position: absolute; inset: 0;
    pointer-events: none;
  }
  .star {
    position: absolute;
    width: 2px; height: 2px;
    background: #fff;
    border-radius: 50%;
    opacity: .7;
    animation: twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle {
    0%, 100% { opacity: .15; transform: scale(.7); }
    50% { opacity: .95; transform: scale(1.3); }
  }

  /* 文字层 */
  .title-wrap {
    position: absolute;
    left: 50%;
    bottom: 14%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    z-index: 10;
    white-space: nowrap;
  }
  .title {
    font-size: clamp(26px, 6.4vw, 74px);
    font-weight: 900;
    letter-spacing: .08em;
    background: linear-gradient(100deg, #ffe9a3 0%, #ffd166 18%, #ff7eb3 40%, #ff5e7e 55%, #a78bfa 75%, #6ee7ff 100%);
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 12px rgba(255, 180, 90, .65)) drop-shadow(0 0 34px rgba(255, 90, 140, .45));
    animation: flow 6s linear infinite, rise 1.6s cubic-bezier(.16,1,.3,1) both;
    opacity: 0;
  }
  @keyframes flow {
    0% { background-position: 0% 50%; }
    100% { background-position: 250% 50%; }
  }
  @keyframes rise {
    0% { opacity: 0; transform: translateY(46px) scale(.86); filter: blur(10px); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  .sub {
    margin-top: 14px;
    font-size: clamp(12px, 2.2vw, 20px);
    letter-spacing: .5em;
    color: #ffd9a0;
    text-shadow: 0 0 14px rgba(255, 170, 80, .8);
    opacity: 0;
    animation: fadeIn 1.4s ease 1.1s forwards;
  }
  @keyframes fadeIn { to { opacity: .92; } }

    /* 爱心 */
  .heart {
    position: absolute;
    top: -30px;
    opacity: .9;
    animation: fall linear infinite;
    user-select: none;
    text-shadow: 0 0 8px currentColor; /* 加一点发光效果 */
  }
  @keyframes fall {
    0% { transform: translateY(-40px) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(105vh) rotate(360deg); opacity: .1; } /* 爱心旋转360度 */
  }

  .hint {
    position: absolute;
    bottom: 4%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: .3em;
    color: rgba(255,255,255,.35);
    animation: fadeIn 1.5s ease 2.6s forwards;
    opacity: 0;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="stars" id="stars"></div>

<div class="title-wrap">
  <div class="title">江江公主新年快乐</div>
  <div class="sub">HAPPY NEW YEAR</div>
</div>

<div class="hint">点击屏幕，放一朵烟花</div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  /* ---------- 星空 ---------- */
  const starBox = document.getElementById('stars');
  for (let i = 0; i < 130; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    const sz = Math.random() * 2 + 1;
    s.style.width = s.style.height = sz + 'px';
    s.style.animationDelay = (Math.random() * 4).toFixed(2) + 's';
    s.style.animationDuration = (2 + Math.random() * 3).toFixed(2) + 's';
    starBox.appendChild(s);
  }

  /* ---------- 彩带 ---------- */
  const colors = ['#ffd166', '#ff7eb3', '#a78bfa', '#6ee7ff', '#ffe9a3', '#ff5e7e', '#7dffb3'];
    for (let i = 0; i < 40; i++) { // 增加了数量，40颗爱心
    const r = document.createElement('div');
    r.className = 'heart'; // 使用新的爱心类名
    r.innerHTML = '❤'; // 直接使用爱心符号
    r.style.left = Math.random() * 100 + '%';
    r.style.color = colors[(Math.random() * colors.length) | 0]; // 用 color 控制爱心颜色
    r.style.animationDuration = (6 + Math.random() * 7).toFixed(2) + 's';
    r.style.animationDelay = (Math.random() * 10).toFixed(2) + 's';
    r.style.fontSize = (14 + Math.random() * 18) + 'px'; // 随机爱心大小
    r.style.opacity = 0.5 + Math.random() * 0.5;
    document.body.appendChild(r);
  }

  /* ---------- 烟花系统 ---------- */
  const gravity = 0.045;
  const friction = 0.985;
  let rockets = [];
  let particles = [];
  let flashes = [];   // 爆闪
  let trails = [];    // 拖尾余晖

  const PALETTES = [
    ['#ff3b3b', '#ff8a3d', '#ffd166', '#fff5c2'],
    ['#ff5e7e', '#ff9ecd', '#c084fc', '#f5d0fe'],
    ['#38bdf8', '#6ee7ff', '#a5f3fc', '#e0f2fe'],
    ['#34d399', '#a7f3d0', '#fef08a', '#fde68a'],
    ['#fbbf24', '#f97316', '#fb7185', '#fecdd3'],
    ['#e879f9', '#818cf8', '#38bdf8', '#f0abfc'],
    ['#ffffff', '#ffe9a3', '#ffd166', '#ffb4a2']
  ];

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

  /* 上升的火箭 */
  class Rocket {
    constructor(x, targetY, palette) {
      this.x = x;
      this.y = H + 10;
      this.targetY = targetY;
      this.vx = rand(-0.5, 0.5);
      this.vy = -Math.sqrt(2 * (this.y - this.targetY) * 0.14);
      this.palette = palette;
      this.hue = Math.random() * 360;
      this.dead = false;
      this.trailTimer = 0;
    }
    update() {
      this.vy += 0.14;
      this.x += this.vx;
      this.y += this.vy;

      // 尾焰
      this.trailTimer++;
      if (this.trailTimer % 1 === 0) {
        trails.push({
          x: this.x + rand(-1.4, 1.4),
          y: this.y + rand(0, 4),
          vx: rand(-0.3, 0.3),
          vy: rand(0.2, 0.9),
          life: 1,
          decay: rand(0.035, 0.06),
          size: rand(1, 2.4),
          color: 'rgba(255,200,120,'
        });
      }

      if (this.vy >= -0.6 || this.y <= this.targetY) {
        this.explode();
        this.dead = true;
      }
    }
    explode() {
      const p = this.palette;
      const count = 90 + ((Math.random() * 60) | 0);
      const power = rand(3.4, 6.2);
      const type = Math.random();

      flashes.push({ x: this.x, y: this.y, life: 1, r: 8, color: p[1] });

      for (let i = 0; i < count; i++) {
        const ang = (Math.PI * 2 * i) / count + rand(-0.06, 0.06);
        let sp = power * rand(0.35, 1);
        // 环形 / 球形 / 心形变化
        if (type > 0.72) sp = power * (0.85 + Math.random() * 0.15);

        particles.push({
          x: this.x,
          y: this.y,
          vx: Math.cos(ang) * sp,
          vy: Math.sin(ang) * sp,
          life: 1,
          decay: rand(0.008, 0.018),
          size: rand(1.2, 2.9),
          color: p[(Math.random() * p.length) | 0],
          twinkle: Math.random() < 0.35,
          spark: Math.random() < 0.18
        });
      }
      // 核心亮团
      for (let i = 0; i < 22; i++) {
        const ang = Math.random() * Math.PI * 2;
        const sp = rand(0.2, 1.4);
        particles.push({
          x: this.x, y: this.y,
          vx: Math.cos(ang) * sp,
          vy: Math.sin(ang) * sp,
          life: 1, decay: rand(0.02, 0.04),
          size: rand(2, 4.5),
          color: '#ffffff',
          twinkle: false, spark: false
        });
      }
    }
    draw() {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, 9);
      g.addColorStop(0, 'rgba(255,255,230,1)');
      g.addColorStop(0.4, 'rgba(255,190,90,0.75)');
      g.addColorStop(1, 'rgba(255,120,40,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(this.x, this.y, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function launch(x, y) {
    const tx = x !== undefined ? x : rand(W * 0.1, W * 0.9);
    const ty = y !== undefined ? y : rand(H * 0.12, H * 0.5);
    rockets.push(new Rocket(tx, ty, pick(PALETTES)));
  }

  /* 自动发射 */
  function autoLaunch() {
    launch();
    setTimeout(autoLaunch, rand(520, 1250));
  }
  setTimeout(autoLaunch, 500);
  // 开场连发
  setTimeout(() => { launch(W * 0.22, H * 0.28); }, 250);
  setTimeout(() => { launch(W * 0.78, H * 0.24); }, 700);
  setTimeout(() => { launch(W * 0.5, H * 0.18); }, 1100);

  /* 点击放烟花 */
  canvas.addEventListener('pointerdown', e => {
    launch(e.clientX, Math.min(e.clientY, H * 0.72));
    // 小范围连爆，更有冲击感
    for (let i = 0; i < 2; i++) {
      setTimeout(() => launch(e.clientX + rand(-90, 90), Math.min(e.clientY + rand(-70, 40), H * 0.7)), 180 + i * 200);
    }
  });

  /* ---------- 主循环 ---------- */
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 16.667, 3);
    last = now;

    // 拖影：用半透明黑覆盖，产生余晖
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(3, 2, 10, 0.22)';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';

    // 尾焰
    for (let i = trails.length - 1; i >= 0; i--) {
      const t = trails[i];
      t.x += t.vx * dt;
      t.y += t.vy * dt;
      t.vy += 0.01 * dt;
      t.life -= t.decay * dt;
      if (t.life <= 0) { trails.splice(i, 1); continue; }
      ctx.fillStyle = t.color + (t.life * 0.5).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.size * t.life, 0, Math.PI * 2);
      ctx.fill();
    }

    // 火箭
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.update();
      if (!r.dead) r.draw();
      else rockets.splice(i, 1);
    }

    // 粒子
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vx *= Math.pow(friction, dt);
      p.vy *= Math.pow(friction, dt);
      p.vy += gravity * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= p.decay * dt;

      if (p.life <= 0 || p.y > H + 40) { particles.splice(i, 1); continue; }

      const a = Math.max(0, p.life);
      let alpha = a;
      if (p.twinkle && Math.random() < 0.25) alpha *= 0.25;

      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      const sz = p.size * (0.35 + a * 0.75);

      if (p.spark && a > 0.45) {
        // 拉丝火花
        ctx.strokeStyle = p.color;
        ctx.lineWidth = sz * 0.9;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 2.4, p.y - p.vy * 2.4);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, sz, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // 爆闪
    for (let i = flashes.length - 1; i >= 0; i--) {
      const f = flashes[i];
      f.life -= 0.06 * dt;
      f.r += 7 * dt;
      if (f.life <= 0) { flashes.splice(i, 1); continue; }
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 3.2);
      g.addColorStop(0, 'rgba(255,255,255,' + (f.life * 0.75) + ')');
      g.addColorStop(0.35, 'rgba(255,220,150,' + (f.life * 0.3) + ')');
      g.addColorStop(1, 'rgba(255,150,60,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * 3.2, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
